base_url = "https://dreamweave-mp.github.io/nif"
title = "nif"
description = "NetImmerse and Gamebryo NIF models, every version Morrowind and OpenMW read, parsed and written raw-preserving, as a Jess package in Luau."
compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]
taxonomies = [{ name = "tags", feed = false }]

[search]
index_format = "fuse_json"
include_title = true
include_description = true
include_content = true
truncate_content_length = 400

[markdown]
highlighting = { theme = "dracula-soft" }
insert_anchor_links = "right"
smart_punctuation = true

[slugify]
paths = "safe"

[link_checker]
skip_prefixes = ["https://github.com/", "https://www.nexusmods.com/"]

[extra]
github_username = "DreamWeave-MP"
github_project = "nif"
logo_text = "nif"
palette = "prism"
menu_items = [
    { name = "nif", url = "@/home/index.md" },
    { name = "Network", url = "@/network.md" },
]

[extra.comments]
enabled = false
category = "General"

# nif as a DreamWeave project: a Jess package. `jess` names the Package Source it
# publishes, the jess.toml at the repository root, and each release tag `nif-<version>` is one
# version of the package, packed by the Mod Template from that tag; every push packs a
# development build.
id = "d6a547e9-7e26-4dcd-a5d0-d7234df8d0c4"
slug = "nif"
type = "library"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.nif"

[[releases]]
version = "0.1.0"
date = 2026-10-21
summary = "First release published as a DreamWeave project."

manifest_version = 1

[package]
id = "org.dreamweave.nif"
version = "0.1.0"
jess_api = "1"
include = ["src"]
tests = ["tests/run.luau"]

[modules]
"@nif" = "src/init.luau"
"@nif/check" = "src/internal/check.luau"
"@nif/fix" = "src/internal/fix.luau"
"@nif/gamebryo" = "src/internal/gamebryo/reader.luau"
"@nif/header" = "src/internal/header.luau"
"@nif/info" = "src/internal/info.luau"
"@nif/scene" = "src/internal/scene.luau"

# Every module here is inert API: it does nothing until something requires it, and runs with the
# authority of whatever calls it. The layer has no entrypoints, so it requires no capability.

[[layer]]
id = "nif.core"
exports = [
    "@nif",
    "@nif/check",
    "@nif/fix",
    "@nif/gamebryo",
    "@nif/header",
    "@nif/info",
    "@nif/scene",
]
